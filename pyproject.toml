[project]
name = "fl-mcp"
version = "0.1.0"
description = "MCP server that lets Claude write chords, melodies and drums into FL Studio on macOS"
requires-python = "==3.12.*"
dependencies = ["mcp>=2,<3", "mido>=1.3,<2", "python-rtmidi>=1.5.8,<2"]

[project.scripts]
fl-mcp = "fl_mcp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["fl-studio-api-stubs>=37,<38", "pytest>=8", "ruff>=0.17.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
